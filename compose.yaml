services:
  memgraph:
    image: memgraph/memgraph:3.5.0
    ports:
      - "127.0.0.1:${HWCATALOG_BOLT_PORT:-17687}:7687"
    command:
      - --storage-mode=IN_MEMORY_TRANSACTIONAL
      - --isolation-level=SNAPSHOT_ISOLATION
      - --storage-wal-enabled=true
      - --storage-wal-file-flush-every-n-tx=1
      - --storage-snapshot-interval-sec=300
      - --storage-snapshot-on-exit=true
      - --data-recovery-on-startup=true
      - --log-level=WARNING
    volumes:
      - catalog-data:/var/lib/memgraph
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | /usr/bin/mgconsole --host 127.0.0.1 --port 7687"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 3s
  lab:
    image: memgraph/lab:3.13.2
    profiles: [lab]
    ports:
      - "127.0.0.1:${HWCATALOG_LAB_PORT:-3000}:3000"
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: "7687"
    depends_on:
      memgraph:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
volumes:
  catalog-data:

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coreref"
version = "0.1.0"
description = "Hardware component representations and build stages backed by Nix"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 "jinja2>=3.1.6,<4",
 "packaging>=24,<27",
 "pyyaml>=6,<7",
 "pydantic>=2.12.5,<3",
 "frozendict>=2.4.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coreref"]

[tool.ruff]
required-version = ">=0.17.2,<0.18"
target-version = "py310"
line-length = 100

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "C4", "C90",
    "PLR", "RUF", "S", "PERF", "ARG", "RET", "PLE", "PLW",
    "PLR0914", "PLR0916", "PLR0917", "PLR1702",
]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 4
max-locals = 10
max-returns = 5
max-bool-expr = 4
max-nested-blocks = 3
max-branches = 8
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["nix: integration tests that use a Nix store"]
addopts = "-ra"

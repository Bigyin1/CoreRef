[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coreref"
version = "0.1.0"
description = "Hardware component representations and dependencies on Conan"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 "conan>=2.34,<2.35",
 "jinja2>=3.1.6,<4",
 "pyyaml>=6,<7",
 "pydantic>=2.14,<3",
 "networkx>=3.4,<4",
 "frozendict>=2.4.7,<3",
 "edify>=0.3,<1; python_version < '3.11'",
 "edify>=1.1.2,<2; python_version >= '3.11'",
 "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
cli = ["typer>=0.24,<1"]
testing = ["conan-server>=2.34,<2.35", "dulwich>=1.2.18,<2", "pytest>=8.4,<10"]

[dependency-groups]
dev = [
    "typer>=0.24,<1",
    "pytest>=8.4",
    "pytest-cov>=6",
    "ruff>=0.14",
    "mypy>=1.18",
    "dulwich>=1.2.18,<2",
    "types-networkx",
    "conan-server>=2.34,<2.35",
    "pytest-benchmark>=5.3,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coreref"]

[tool.ruff]
required-version = ">=0.17.2,<0.18"
target-version = "py310"
line-length = 100

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "C4", "C90",
    "PLR", "RUF", "S", "PERF", "ARG", "RET", "PLE", "PLW",
    "PLR0914", "PLR0916", "PLR0917", "PLR1702",
]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 4
max-locals = 10
max-returns = 5
max-bool-expr = 4
max-nested-blocks = 3
max-branches = 8
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.10"
# pytest-benchmark exposes a typed fixture with an untyped pedantic method.
untyped_calls_exclude = ["pytest_benchmark"]
strict = true
files = ["src", "tests"]

# Edify 0.3 (Python 3.10) has no typing metadata; 1.x remains typed.
[[tool.mypy.overrides]]
module = ["edify", "edify.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: opt-in public API timing and operation budgets",
    "conan: uses the real Conan command API in isolated caches",
    "conan_remote: uses an owned temporary Conan server",
]
addopts = "-ra -m 'not performance'"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "coreref.api.query.SearchQuery",
]
